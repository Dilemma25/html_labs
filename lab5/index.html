<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Page</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .card {
            border: none;
            border-radius: 0;
            box-shadow: 2px 6px 8px 0 rgba(22, 22, 26, 0.18);
        }

        .carousel-inner {
            padding: 1em;
        }

        .carousel-control-prev,
        .carousel-control-next {
            background-color: #e1e1e1;
            width: 6vh;
            height: 6vh;
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
        }

        .carousel-control-prev span,
        .carousel-control-next span {
            width: 1.5rem;
            height: 1.5rem;
        }

        .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
        }


        .hover-shadow:hover {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transform: scale(1.05);
            transition: all 0.3s ease-in-out;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            background-color: #f4f4f4;
        }

        /* Изменения для увеличения элементов внутри mainConteiner */
        .mainConteiner {
            width: 100vw;
            justify-items: center;
        }

        .mainConteiner .container.mt-4 {
            width: 100% !important;
            max-width: 100%;
        }

        .mainConteiner .row {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
        }

        .mainConteiner .col-lg-8 {
            width: 75%;
            /* flex-grow: 1; */
        }

        .mainConteiner .col-lg-4 {
            /* flex-grow: 2; */
            width: 25%;
        }

        .mainConteiner .card {
            width: 100%;
        }

        @media screen and (min-width: 577px) {
            .cards-wrapper {
                display: flex;
            }

            .card {
                margin: 0 0.5em;
                width: calc(100% / 2);
            }

            .image-wrapper {
                height: 20vw;
                margin: 0 auto;
            }
        }

        @media screen and (max-width: 576px) {
            .card:not(:first-child) {
                display: none;
            }
        }
    </style>
</head>
